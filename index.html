<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Braden's 3D Head Generator</title>
    <link rel="icon" type="image/png" href="favicon.ico"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<h1>Braden's 3D Head Generator</h1>

<div class="workspace">
    <section class="panel">
        <h2>Lighting</h2>

        <div class="control">
            <label for="ambient">Ambient</label>
            <div class="control-row">
                <input id="ambient-slider" type="range"/>
                <input id="ambient" type="number" step="0.01"/>
            </div>
        </div>

        <div class="control">
            <label for="hemisphere">Hemisphere</label>
            <div class="control-row">
                <input id="hemisphere-slider" type="range"/>
                <input id="hemisphere" type="number" step="0.01"/>
            </div>
        </div>

        <div class="control">
            <label for="directional">Directional</label>
            <div class="control-row">
                <input id="directional-slider" type="range"/>
                <input id="directional" type="number" step="0.01"/>
            </div>
        </div>

        <div class="control">
            <label for="lightX">Light X</label>
            <div class="control-row">
                <input id="lightX-slider" type="range"/>
                <input id="lightX" type="number" step="0.01"/>
            </div>
        </div>

        <div class="control">
            <label for="lightY">Light Y</label>
            <div class="control-row">
                <input id="lightY-slider" type="range"/>
                <input id="lightY" type="number" step="0.01"/>
            </div>
        </div>

        <div class="control">
            <label for="lightZ">Light Z</label>
            <div class="control-row">
                <input id="lightZ-slider" type="range"/>
                <input id="lightZ" type="number" step="0.01"/>
            </div>
        </div>

        <div class="panel-reset">
            <button id="reset-lighting-button" type="button">Reset Lighting</button>
        </div>
    </section>

    <main class="center">
        <div class="mode-toggle">
            <button id="mode-head" type="button" class="active">Head</button>
            <button id="mode-body" type="button">Full Body</button>
        </div>

        <div id="preview-container"></div>

        <div class="username-section">
            <label for="username">Minecraft Username</label>
            <input id="username" type="text" placeholder="Enter username" autocomplete="off"/>
        </div>

        <div class="buttons">
            <button id="load-button" type="button">Load Skin</button>
            <button id="load-file-button" type="button">Load from File</button>
            <input id="skin-file" type="file" accept="image/png" hidden=""/>
            <button id="download-render-button" type="button">Download Render</button>
            <button id="download-skin-button" type="button">Download Skin</button>
        </div>

        <label class="checkbox-control">
            <input id="include-hat" type="checkbox" checked=""/>
            Include Hat / Outer Layer
        </label>

        <label class="checkbox-control">
            <input id="slim-arms" type="checkbox"/>
            Slim Arms (Alex model)
        </label>
    </main>

    <section class="panel">
        <h2>Camera / Head</h2>

        <div class="control">
            <label for="pitch">Pitch</label>
            <div class="control-row">
                <input id="pitch-slider" type="range"/>
                <input id="pitch" type="number" step="1"/>
            </div>
        </div>

        <div class="control">
            <label for="yaw">Yaw</label>
            <div class="control-row">
                <input id="yaw-slider" type="range"/>
                <input id="yaw" type="number" step="1"/>
            </div>
        </div>

        <div class="control">
            <label for="roll">Roll</label>
            <div class="control-row">
                <input id="roll-slider" type="range"/>
                <input id="roll" type="number" step="1"/>
            </div>
        </div>

        <div class="control">
            <label for="zoom">Zoom</label>
            <div class="control-row">
                <input id="zoom-slider" type="range"/>
                <input id="zoom" type="number" step="0.01"/>
            </div>
        </div>

        <div class="control">
            <label for="layerScale">Layer Scale</label>
            <div class="control-row">
                <input id="layerScale-slider" type="range"/>
                <input id="layerScale" type="number" step="0.01"/>
            </div>
        </div>

        <div class="panel-reset">
            <button id="reset-camera-button" type="button">Reset Camera</button>
        </div>
    </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/headgen.js"></script>
<script src="js/main.js"></script>
</body>
</html>
